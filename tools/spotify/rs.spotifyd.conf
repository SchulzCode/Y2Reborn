<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Y2Reborn's Spotify: spotifyd (started by Reborn, as root) registers
     rs.spotifyd.instance<pid> on the system bus; Reborn controls it there.
     Install as /usr/share/dbus-1/system.d/rs.spotifyd.conf. -->
<busconfig>
  <policy user="root">
    <allow own_prefix="rs.spotifyd"/>
    <allow send_destination_prefix="rs.spotifyd"/>
    <allow receive_sender="rs.spotifyd"/>
  </policy>
</busconfig>
