[workspace]
resolver = "3"
members = [
    "vendor/housecat/housecat-protocol",
    "vendor/housecat/housecat-core",
    "vendor/housecat/housecat-metadata",
    "reborn-spotify-metadata",
]
# vendor/housecat/housecat (the facade crate) isn't a member: it only
# wraps housecat-core+housecat-metadata in ~80 lines (Session/SessionBuilder),
# which reborn-spotify-metadata/src/main.rs reimplements directly against the
# two crates it actually needs -- one fewer vendored crate, no feature-
# toggling question over the facade's own `metadata`/`audio` feature flags.

# Deliberately excludes vendor/housecat/housecat-audio: this workspace never
# copied that crate in at all (see vendor/housecat/NOTICE.md) -- audio stays
# on spotifyd/librespot (crates/reborn-platform/src/spotify.rs). This
# workspace exists for library browsing only, which doesn't touch audio.
#
# It is its own workspace, outside Reborn's (the root Cargo.toml excludes
# it): its dependencies (tokio, reqwest, prost, ...) are not in Reborn's
# vendor/ directory. See README.md for building it.
#
# [workspace.dependencies] below is copied verbatim from housecat's own
# workspace root so its vendored crates' `{ workspace = true }` references
# keep resolving -- including entries (shannon/aes/ctr/symphonia/cpal) that
# nothing in *our* member list actually uses now that housecat-audio is
# excluded. That's harmless: an unused workspace.dependencies entry is never
# fetched or built unless some member's own [dependencies] names it.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
housecat-protocol = { path = "vendor/housecat/housecat-protocol" }
housecat-core = { path = "vendor/housecat/housecat-core" }
housecat-metadata = { path = "vendor/housecat/housecat-metadata" }
housecat-audio = { path = "vendor/housecat/housecat-audio" }
housecat = { path = "vendor/housecat/housecat" }

prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
protox = "0.9"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "form"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

shannon = "0.2"
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
hmac = "0.12"
num-bigint = "0.4"
getrandom = "0.3"
base64 = "0.22"
hex = "0.4"
url = "2"
roxmltree = "0.21"

aes = "0.9"
ctr = "0.10"
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis", "mp3"] }
cpal = "0.18"

wiremock = "0.6"
tempfile = "3"
