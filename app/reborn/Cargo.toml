[package]
name = "reborn"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
reborn-core = { path = "../../crates/reborn-core" }
reborn-observability = { path = "../../crates/reborn-observability" }
reborn-media = { path = "../../crates/reborn-media" }
reborn-audio = { path = "../../crates/reborn-audio" }
reborn-library = { path = "../../crates/reborn-library" }
reborn-platform = { path = "../../crates/reborn-platform" }
reborn-graphics = { path = "../../crates/reborn-graphics" }
reborn-ui = { path = "../../crates/reborn-ui" }
reborn-control = { path = "../../crates/reborn-control" }

[[bin]]
name = "reborn"
path = "src/main.rs"

[[bin]]
name = "rebornctl"
path = "src/ctl.rs"

[[bin]]
name = "reborn-preview"
path = "src/bin/reborn-preview.rs"
